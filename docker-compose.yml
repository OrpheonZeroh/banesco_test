version: '3.8'

services:
  etl-script:
    build: .
    container_name: etl-processor
    environment:
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
    volumes:
      - ./data:/app/data:ro          # Solo lectura para datos de entrada
      - ./output:/app/output:rw      # Lectura/escritura para resultados
      - ./.env:/app/.env:ro          # Variables de entorno (opcional)
    command: [
      "--orders", "/app/data/orders.csv",
      "--out", "/app/output/integration_output.json",
      "--concurrency", "5"
    ]
    restart: "no"
    
    # Opcional: Limitar recursos
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

# Red opcional para múltiples servicios
networks:
  default:
    name: etl-network